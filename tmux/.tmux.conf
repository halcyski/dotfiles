# ~/.tmux.conf

# true color passthrough so kitty's colors and the nvim theme render right
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*:Tc"

# advertise kitty's extended keys so the keyboard protocol passes through
set -ga terminal-features ",xterm-kitty:extkeys"

# faster key response; helps nvim escape latency
set -sg escape-time 10

# mouse: click panes, drag borders, scroll
set -g mouse on

# start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# bigger scrollback
set -g history-limit 50000

# tell running programs (nvim) when focus changes, so autoread can fire
set -g focus-events on

# enable extended keys for pi and the kitty keyboard protocol
set -g extended-keys always

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# splits that keep the current directory, with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# windows are tabs: new tab keeps the current dir; switch with prefix
# + n/p or prefix + number (shown along the status bar).
bind c new-window -c "#{pane_current_path}"
