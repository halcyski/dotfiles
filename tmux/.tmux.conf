# ~/.tmux.conf

# true color passthrough so kitty's colors and the nvim theme render right
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*:Tc"

# advertise kitty's extended keys so the keyboard protocol passes through
set -ga terminal-features ",xterm-kitty:extkeys"

# faster key response; helps nvim escape latency
set -sg escape-time 10

# mouse: click panes, drag borders, scroll
set -g mouse on

# start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# bigger scrollback
set -g history-limit 50000

# tell running programs (nvim) when focus changes, so autoread can fire
set -g focus-events on

# emit extended keys only when the foreground application requests them
set -g extended-keys on

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# splits that keep the current directory, with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# windows are tabs: new tab keeps the current dir; switch with prefix
# + n/p or prefix + number (shown along the status bar).
bind c new-window -c "#{pane_current_path}"

# ephemeral tools inherit the active pane directory; uppercase avoids default keys
bind S display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "bash"
bind g display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "bash -lc 'git status --short; printf \"\\n--- diff ---\\n\"; command -v delta >/dev/null || { echo \"delta is required\"; exec bash; }; git -c core.pager=delta -c delta.side-by-side=true diff; exec bash'"
bind M display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "bash -lc 'git log --oneline --decorate -n 30; exec bash'"
bind F display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "bash -lc 'command -v fzf >/dev/null && command -v fd >/dev/null || { echo \"fzf and fd are required\"; exit 1; }; fd -0 --type f --hidden --exclude .git | fzf --read0 --print0 | xargs -0 -r nvim'"
bind / display-popup -E -w 85% -h 85% "less ~/dotfiles/CHEATSHEET.md"

# workspace context only; Starship owns shell and process context
set -g status on
set -g status-interval 5
set -g status-left-length 80
set -g status-left '#S | #(git -C "#{pane_current_path}" rev-parse --is-inside-work-tree >/dev/null 2>&1 && { git -C "#{pane_current_path}" branch --show-current; git -C "#{pane_current_path}" status --porcelain 2>/dev/null | grep -q . && printf "*"; }) | '
set -g status-right '%H:%M'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #[bold]#I:#W#[default] '
